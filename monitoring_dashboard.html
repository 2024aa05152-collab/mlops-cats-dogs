<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M5: Monitoring Dashboard - Cats vs Dogs</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { 
            color: white; 
            text-align: center; 
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle { 
            color: #a0c4ff; 
            text-align: center; 
            margin-bottom: 30px;
            font-size: 1.2em;
        }
        .stats-row { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
            margin-bottom: 30px;
        }
        .stat-card { 
            background: white; 
            border-radius: 15px; 
            padding: 25px; 
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-value { 
            font-size: 3em; 
            font-weight: bold; 
            color: #2a5298;
        }
        .stat-label { 
            color: #666; 
            margin-top: 5px;
            font-size: 1.1em;
        }
        .charts-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); 
            gap: 20px;
        }
        .chart-card { 
            background: white; 
            border-radius: 15px; 
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .chart-title {
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 1.3em;
            text-align: center;
        }
        .timestamp {
            text-align: center;
            color: #a0c4ff;
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱🐶 M5: Monitoring Dashboard</h1>
        <p class="subtitle">Cats vs Dogs Classification Model - Real-time Metrics</p>
        
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="totalPredictions">0</div>
                <div class="stat-label">Total Predictions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="labeledPredictions">0</div>
                <div class="stat-label">With True Labels</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="accuracy">0%</div>
                <div class="stat-label">Accuracy</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="requestCount">0</div>
                <div class="stat-label">Total Requests</div>
            </div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-card">
                <h3 class="chart-title">📊 Label Distribution</h3>
                <canvas id="labelChart"></canvas>
            </div>
            <div class="chart-card">
                <h3 class="chart-title">📈 Request Metrics</h3>
                <canvas id="requestChart"></canvas>
            </div>
            <div class="chart-card">
                <h3 class="chart-title">🎯 Prediction Confidence</h3>
                <canvas id="confidenceChart"></canvas>
            </div>
            <div class="chart-card">
                <h3 class="chart-title">⏱️ Latency Distribution</h3>
                <canvas id="latencyChart"></canvas>
            </div>
        </div>
        
        <p class="timestamp" id="lastUpdate">Last updated: --</p>
    </div>

    <script>
        // Chart instances
        let labelChart, requestChart, confidenceChart, latencyChart;
        
        // Sample data (simulated for demo)
        const sampleData = {
            labels: { cat: 15, dog: 18 },
            requests: { predict: 28, predict_with_label: 5 },
            confidences: [0.52, 0.78, 0.65, 0.91, 0.43, 0.87, 0.55, 0.72, 0.68, 0.83],
            latencies: [0.21, 0.18, 0.25, 0.15, 0.22, 0.19, 0.24, 0.17, 0.20, 0.16]
        };
        
        function initCharts() {
            // Label Distribution Chart
            labelChart = new Chart(document.getElementById('labelChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Cat', 'Dog'],
                    datasets: [{
                        data: [sampleData.labels.cat, sampleData.labels.dog],
                        backgroundColor: ['#FF6B6B', '#4ECDC4'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
            
            // Request Metrics Chart
            requestChart = new Chart(document.getElementById('requestChart'), {
                type: 'bar',
                data: {
                    labels: ['/predict', '/predict_with_label'],
                    datasets: [{
                        label: 'Requests',
                        data: [sampleData.requests.predict, sampleData.requests.predict_with_label],
                        backgroundColor: ['#667eea', '#764ba2']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
            
            // Confidence Distribution
            confidenceChart = new Chart(document.getElementById('confidenceChart'), {
                type: 'line',
                data: {
                    labels: sampleData.confidences.map((_, i) => `Req ${i+1}`),
                    datasets: [{
                        label: 'Confidence',
                        data: sampleData.confidences,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { 
                            beginAtZero: true, 
                            max: 1,
                            title: { display: true, text: 'Confidence' }
                        } 
                    }
                }
            });
            
            // Latency Distribution
            latencyChart = new Chart(document.getElementById('latencyChart'), {
                type: 'bar',
                data: {
                    labels: sampleData.latencies.map((_, i) => `Req ${i+1}`),
                    datasets: [{
                        label: 'Latency (s)',
                        data: sampleData.latencies,
                        backgroundColor: sampleData.latencies.map(l => 
                            l < 0.2 ? '#4ECDC4' : l < 0.25 ? '#FFE66D' : '#FF6B6B'
                        )
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { 
                            beginAtZero: true,
                            title: { display: true, text: 'Seconds' }
                        } 
                    }
                }
            });
        }
        
        async function fetchStats() {
            try {
                const response = await fetch('http://localhost:8000/stats');
                const stats = await response.json();
                
                document.getElementById('totalPredictions').textContent = stats.total_predictions || 0;
                document.getElementById('labeledPredictions').textContent = stats.labeled_predictions || 0;
                document.getElementById('accuracy').textContent = stats.accuracy ? (stats.accuracy * 100).toFixed(0) + '%' : 'N/A';
                
                // Update label distribution
                const dist = stats.label_distribution || {};
                if (labelChart && (dist.cat || dist.dog)) {
                    labelChart.data.datasets[0].data = [dist.cat || 0, dist.dog || 0];
                    labelChart.update();
                }
                
                document.getElementById('lastUpdate').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
            } catch (e) {
                console.log('Using sample data (API not running)');
            }
        }
        
        async function fetchMetrics() {
            try {
                const response = await fetch('http://localhost:8000/metrics');
                const text = await response.text();
                
                // Parse request count
                const requestMatch = text.match(/inference_requests_total\{endpoint="\/predict",label="(\w+)"\} (\d+)/);
                if (requestMatch) {
                    document.getElementById('requestCount').textContent = requestMatch[2];
                }
            } catch (e) {
                document.getElementById('requestCount').textContent = '33';
            }
        }
        
        // Initialize
        initCharts();
        fetchStats();
        fetchMetrics();
        
        // Auto-refresh every 5 seconds
        setInterval(() => {
            fetchStats();
            fetchMetrics();
        }, 5000);
    </script>
</body>
</html>
