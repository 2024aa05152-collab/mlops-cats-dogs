name: MLOps CI/CD/CT Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-test-train-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Python setup
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install dvc dvc-s3 dagshub mlflow flake8 black pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Lint code
    - name: Lint code (Flake8)
      continue-on-error: true
      run: |
        flake8 src app.py tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src app.py tests --count --exit-zero --max-complexity=10 --statistics


    # 5. Run Unit Tests
    - name: Run unit tests with coverage
      run: |
        pytest tests/ -v --cov=src --cov-report=xml

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

    # 6. DVC Pull (Get the data)
    - name: Pull Data from DagsHub (DVC)
      env:
        DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        dvc remote modify origin --local auth basic
        dvc remote modify origin --local user $DAGSHUB_USERNAME
        dvc remote modify origin --local password $DAGSHUB_TOKEN
        dvc pull -r origin

    # 7. Train Model (Train & Log to Registry)
    # Training was performed in GPU Machine and pushed the model to registry. Training CNN model with 40k images will take forever in github runner.
    # - name: Train model
    #   env:
    #     MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
    #     MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
    #     MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
    #   run: |
    #     python src/train.py

    # 8. Docker build and push (Continuous Deployment)
    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/mlops-cats-dogs:latest

    # 9. Log to GitHub Artifactory
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: logs/
