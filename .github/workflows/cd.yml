name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV

      - name: Verify Kubernetes cluster
        run: kubectl get nodes

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Update deployment image
        run: |
          kubectl set image deployment/cats-dogs-model-group85 \
          catsdogs=$IMAGE_TAG

      - name: Wait for rollout
        run: kubectl rollout status deployment cats-dogs-model-group85

      - name: Show service
        run: kubectl get svc

      - name: Smoke test - health
        run: curl -f http://localhost:30007/health

      - name: Smoke test - prediction
        run: |
          curl -X POST http://localhost:30007/predict \
          -H "Content-Type: application/json" \
          -d '{"image":"test"}'
